<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicketPilot Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>[x-cloak] { display: none !important; }
    .resolution-content { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin: 8px 0; font-size: 0.85rem; line-height: 1.6; }
    .resolution-content h1,.resolution-content h2,.resolution-content h3 { margin: 12px 0 6px; color: #1e293b; }
    .resolution-content ul,.resolution-content ol { padding-left: 20px; margin: 6px 0; }
    .resolution-content p { margin: 6px 0; }
    .resolution-content strong { font-weight: 600; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
<div x-data="admin()" x-cloak class="min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-slate-200 p-5 hidden lg:flex flex-col">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-lg">TP</div>
            <div>
                <h1 class="font-bold text-lg">TicketPilot</h1>
                <p class="text-xs text-slate-400">Admin Console</p>
            </div>
        </div>
        <nav class="flex flex-col gap-1">
            <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-600 hover:bg-slate-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                Dashboard
            </a>
            <a href="/admin" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-red-50 text-red-700 font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                Admin
            </a>
        </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-4 lg:p-8 max-w-5xl mx-auto w-full">

        <!-- Mobile header -->
        <div class="flex items-center justify-between lg:hidden mb-6">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-blue-600 rounded-xl flex items-center justify-center text-white font-bold text-sm">TP</div>
                <h1 class="font-bold">Admin</h1>
            </div>
            <a href="/" class="text-blue-600 text-sm font-medium">← Dashboard</a>
        </div>

        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div>
                <h2 class="text-2xl font-bold">🚨 Escalated Tickets</h2>
                <p class="text-sm text-slate-500 mt-1" x-text="'Human review needed: ' + tickets.length + ' ticket(s)'"></p>
            </div>
            <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                <span class="text-xs text-slate-400">Auto-refresh 10s</span>
            </div>
        </div>

        <!-- Empty state -->
        <div x-show="!tickets.length" class="bg-white rounded-xl border border-slate-200 p-12 text-center">
            <p class="text-4xl mb-3">✅</p>
            <p class="text-slate-500 font-medium">No escalated tickets. All resolved!</p>
        </div>

        <!-- Ticket list -->
        <div class="space-y-4">
            <template x-for="t in tickets" :key="t.id">
                <div class="bg-white rounded-xl border border-red-200 p-5">
                    <div class="flex items-start justify-between gap-3 mb-3">
                        <div>
                            <h3 class="font-bold">Ticket #<span x-text="t.id"></span> 
                                <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-50 text-red-700">escalated</span>
                            </h3>
                            <p class="text-sm mt-1" x-text="t.description"></p>
                        </div>
                    </div>
                    
                    <!-- Meta badges -->
                    <div class="flex flex-wrap gap-2 mb-3" x-show="Object.keys(t.escalation_info || {}).length">
                        <template x-for="(val, key) in t.escalation_info">
                            <span class="text-xs bg-slate-100 text-slate-600 px-2 py-1 rounded-md" x-show="['reason','category','priority'].includes(key)" x-text="key + ': ' + val"></span>
                        </template>
                    </div>

                    <!-- AI resolution collapsible -->
                    <details x-show="t.resolution" class="mb-3">
                        <summary class="text-sm text-blue-600 hover:text-blue-700 cursor-pointer font-medium">📄 View AI resolution (reference)</summary>
                        <div class="resolution-content mt-2" x-html="renderMD(t.resolution)"></div>
                    </details>

                    <!-- Resolve form -->
                    <form @submit.prevent="resolveTicket(t.id)" class="border-t border-slate-100 pt-4">
                        <label class="font-medium text-sm block mb-2">✏️ Your Resolution:</label>
                        <textarea x-model="resolutions[t.id]" rows="3" placeholder="Enter resolution..." class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none" required></textarea>
                        <div class="flex items-center gap-2 mt-2">
                            <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition" 
                                    :disabled="resolving === t.id">
                                <span x-show="resolving !== t.id">✅ Mark as Resolved</span>
                                <span x-show="resolving === t.id">Resolving...</span>
                            </button>
                            <span x-show="resolvedId === t.id" class="text-sm text-emerald-600">✅ Resolved!</span>
                        </div>
                    </form>
                </div>
            </template>
        </div>
    </main>
</div>

<script>
function admin() {
    return {
        tickets: [],
        resolutions: {},
        resolving: null,
        resolvedId: null,
        timer: null,

        init() {
            this.load();
            this.timer = setInterval(() => this.load(), 10000);
        },

        renderMD(text) {
            try { return DOMPurify.sanitize(marked.parse(text || '')); } catch(e) { return ''; }
        },

        async load() {
            try {
                const r = await fetch('/api/v1/tickets?status=escalated');
                if (!r.ok) throw new Error('API Error ' + r.status);
                this.tickets = (await r.json()).tickets || [];
            } catch(e) { console.warn('Load error', e); }
        },

        async resolveTicket(id) {
            this.resolving = id;
            try {
                const r = await fetch('/api/v1/tickets/' + id + '/resolve', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({resolution: this.resolutions[id] || ''})
                });
                if (r.ok) {
                    this.resolvedId = id;
                    setTimeout(() => { this.resolvedId = null; this.load(); }, 1500);
                } else {
                    const err = await r.json();
                    alert('Error: ' + (err.detail || 'Unknown'));
                }
            } catch(e) { alert('Error: ' + e.message); }
            finally { this.resolving = null; }
        }
    }
}
</script>
</body>
</html>
